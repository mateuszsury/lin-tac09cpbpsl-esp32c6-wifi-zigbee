name: Feature request
description: Propose a protocol, firmware, Home Assistant or Zigbee improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: checkboxes
    attributes:
      label: Scope and safety
      options:
        - label: I checked the documentation and existing issues.
          required: true
        - label: This request does not rely on publishing credentials or private household data.
          required: true
  - type: textarea
    attributes:
      label: Problem
      description: Describe the missing behavior and who needs it.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
      description: Include hardware, profile, transport and protocol evidence when relevant.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives and risks
      description: Explain workarounds and whether the change can drive UART lines or actuate the appliance.
