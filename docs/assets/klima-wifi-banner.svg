<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">LIN TAC09CPBPSL Wi-Fi and Zigbee control with ESP32-C6</title>
  <desc id="desc">A local UART MITM bridge connecting the LIN TAC09CPBPSL panel and main controller to MQTT, Home Assistant and Zigbee2MQTT.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2e"/>
      <stop offset="1" stop-color="#123c5a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42c7ff"/>
      <stop offset="1" stop-color="#65e6b4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1090" cy="40" r="190" fill="#42c7ff" opacity=".08"/>
  <circle cx="1030" cy="380" r="230" fill="#65e6b4" opacity=".06"/>
  <rect x="68" y="63" width="9" height="154" rx="4.5" fill="url(#accent)"/>
  <text x="108" y="126" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="700">LIN TAC09CPBPSL</text>
  <text x="108" y="177" fill="#b9d9eb" font-family="Segoe UI,Arial,sans-serif" font-size="28">Wi-Fi and Zigbee control with ESP32-C6</text>
  <text x="108" y="230" fill="#7fa9c2" font-family="Segoe UI,Arial,sans-serif" font-size="20">UART reverse engineering · MQTT · Home Assistant · Zigbee2MQTT · OTA</text>
  <g transform="translate(96 290)" filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="0" y="0" width="190" height="72" rx="16" fill="#102c43" stroke="#3d7493"/>
    <text x="95" y="44" text-anchor="middle" fill="#e8f6ff" font-size="21">Display panel</text>
    <path d="M190 36H325" stroke="#42c7ff" stroke-width="4"/>
    <path d="m315 27 12 9-12 9M200 27l-12 9 12 9" fill="none" stroke="#42c7ff" stroke-width="4"/>
    <rect x="325" y="0" width="220" height="72" rx="16" fill="#113e50" stroke="#65e6b4"/>
    <text x="435" y="30" text-anchor="middle" fill="#fff" font-size="19" font-weight="600">ESP32-C6</text>
    <text x="435" y="53" text-anchor="middle" fill="#9eeed0" font-size="15">NTS0104 UART bridge</text>
    <path d="M545 36H680" stroke="#42c7ff" stroke-width="4"/>
    <path d="m670 27 12 9-12 9M555 27l-12 9 12 9" fill="none" stroke="#42c7ff" stroke-width="4"/>
    <rect x="680" y="0" width="190" height="72" rx="16" fill="#102c43" stroke="#3d7493"/>
    <text x="775" y="44" text-anchor="middle" fill="#e8f6ff" font-size="21">Main controller</text>
    <rect x="902" y="0" width="160" height="72" rx="16" fill="#112f45" stroke="#3d7493"/>
    <text x="982" y="30" text-anchor="middle" fill="#fff" font-size="17">Wi-Fi + Zigbee</text>
    <text x="982" y="53" text-anchor="middle" fill="#9ec6db" font-size="14">Local control</text>
  </g>
</svg>
